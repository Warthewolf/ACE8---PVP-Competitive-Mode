# RVNG in-game test logger (docs/IN_GAME_TESTS.md). Read once when the game starts.
# probe=1 turns it on; with probe=0 (or without this file) the DLL hooks nothing.
probe=0
# LiveWebAPI gates: block (log the game's answer, answer false), observe (log only) or off (not hooked)
gates=block
# Test 2, second run: d2=1 releases the SyncStartMatch gate (the solo stand-in for RVNG's synchronized start)
d2=0
# Test 2, third run: w1=1 writes GM+0x80c = 2 when GameTerminating (state 15) starts
w1=0
# Ctrl+F6's deathmatch MissionID: 160010, 160020, 160030, 160040 or 160060
mission=160010
